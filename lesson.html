<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
<title>Travel English</title>
<style>
:root{--primary:#2563eb;--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--you:#eff6ff;--them:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:720px;margin:0 auto;padding:24px 16px 60px}
.back{display:inline-block;color:var(--primary);text-decoration:none;font-size:14px;margin-bottom:16px}
h1{font-size:24px;font-weight:800;margin-bottom:4px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:20px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -16px 20px;padding:10px 16px;flex-wrap:wrap;position:sticky;top:var(--topbar-h,56px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.toggles{display:flex;gap:8px;align-items:center}
.toggle-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.toggle-btn.off{background:#f1f5f9;color:#94a3b8}
.toggle-btn .dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.toggle-btn.off .dot{background:#cbd5e1}
.play-all-btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;margin-left:auto}
.play-all-btn.playing{background:#dc2626}
.play-all-btn.is-hidden{display:none}
.dialogue{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.turn{position:relative;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 44px 14px 16px;cursor:pointer}
.turn.no-audio{cursor:default;padding-right:16px}
.turn.playing{border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
.turn.you{background:var(--you)}.turn.them{background:var(--them)}
.play-btn{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:11px;cursor:pointer}
.play-btn.playing{background:#dc2626}
.speaker{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.speaker.you{color:var(--primary)}.speaker.them{color:#64748b}
.en{font-size:18px;margin-bottom:3px}.ko{font-size:14px;color:var(--muted)}
body.hide-en .en{display:none}body.hide-ko .ko{display:none}
.tips{background:#fefce8;border:1px solid #fef08a;border-radius:12px;padding:16px}
.tips h3{font-size:14px;margin-bottom:8px}.tips ul{padding-left:18px;font-size:14px;color:#713f12}
.ko-line{display:flex;align-items:flex-end;gap:8px;margin-right:-34px}.ko-line .ko{flex:1;min-width:0}
.search-btn{position:static;flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid #e2e8f0;background:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;margin-left:auto}
.search-btn svg{width:16px;height:16px;display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -16px 16px;padding:8px 16px;position:sticky;top:0;z-index:21;background:var(--bg)}
.done-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.done-btn .box{width:18px;height:18px;border:2px solid #cbd5e1;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:12px;color:#fff}
.done-btn.on{background:#ecfdf5;border-color:#86efac;color:#15803d}
.done-btn.on .box{background:#22c55e;border-color:#16a34a}
.done-btn.on .box:after{content:"\2713"}

</style>
</head>
<body>
<div class="container">
<div class="topbar">
<a class="back" href="index.html" style="margin-bottom:0">← 목록으로</a>
<button type="button" class="done-btn" id="doneBtn" onclick="toggleDone()"><span class="box"></span> 완료</button>
</div>
<h1 id="title"></h1>
<p class="subtitle" id="subtitle"></p>
<div class="toolbar">
  <div class="toggles">
    <button class="toggle-btn" id="toggleEn" onclick="toggleLang('en')"><span class="dot"></span> 영어</button>
    <button class="toggle-btn" id="toggleKo" onclick="toggleLang('ko')"><span class="dot"></span> 한국어</button>
    <button class="toggle-btn off" id="toggleRepeat" onclick="toggleRepeat()"><span class="dot"></span> 반복</button>
  </div>
  <button class="play-all-btn" id="playAllBtn" onclick="playAll()">▶ 전체 재생</button>
</div>
<div class="dialogue" id="dialogue"></div>
<div class="tips" id="tipsBox" style="display:none"><h3>💡 Useful Expressions</h3><ul id="tips"></ul></div>
</div>
<script src="app.js?v=14"></script>
<script>
const GICON='<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>';
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function toggleLang(lang){TEPlayer.toggleLang(lang);}
function playAll(){TEPlayer.playAll();}
function toggleRepeat(){TEPlayer.toggleRepeat();}
function playTurn(el){TEPlayer.playTurn(el);}
var currentLessonId=null;
function syncDoneBtn(){
  var btn=document.getElementById('doneBtn');
  if(!btn||!currentLessonId) return;
  btn.classList.toggle('on', TEDone.isDone(currentLessonId));
}
function toggleDone(){
  if(!currentLessonId) return;
  TEDone.toggle(currentLessonId);
  syncDoneBtn();
}
function markNoAudio(el){
  el.classList.add('no-audio');
  el.removeAttribute('data-src');
  el.onclick=null;
  var b=el.querySelector('.play-btn');
  if(b) b.remove();
  if(TEPlayer.syncPlayAllBtn) TEPlayer.syncPlayAllBtn();
}
function probeAudio(src){
  return fetch(src,{method:'HEAD',cache:'no-store'}).then(function(r){
    if(r.ok) return true;
    return fetch(src,{method:'GET',headers:{Range:'bytes=0-1'},cache:'no-store'}).then(function(r2){
      return r2.ok;
    });
  }).catch(function(){ return false; });
}
function render(lesson){
  currentLessonId=lesson.id; syncDoneBtn();
  document.title='#'+lesson.id+' '+lesson.title_en+' | Travel English';
  document.getElementById('title').textContent='#'+lesson.id+' '+lesson.title_en;
  document.getElementById('subtitle').textContent=lesson.subtitle||lesson.title_ko;
  var box=document.getElementById('dialogue');
  box.innerHTML='';
  (lesson.turns||[]).forEach(function(turn){
    var el=document.createElement('div');
    el.className='turn '+(turn.role==='you'?'you':'them');
    var src=(turn.audio||'').trim();
    var q=encodeURIComponent((turn.en||'')+' 이 영어 문장을 번역하고 설명해줘');
    var playHtml=src?'<button class="play-btn" type="button">▶</button>':'';
    el.innerHTML=playHtml+
      '<div class="speaker '+(turn.role==='you'?'you':'them')+'">'+esc(turn.speaker||(turn.role==='you'?'You':'Staff'))+'</div>'+
      '<div class="en">'+esc(turn.en)+'</div>'+
      '<div class="ko-line"><div class="ko">'+esc(turn.ko)+'</div>'+
      '<a class="search-btn" href="https://www.google.com/search?q='+q+'" target="_blank" rel="noopener noreferrer">'+GICON+'</a></div>';
    el.querySelector('.search-btn').addEventListener('click',function(e){e.stopPropagation();});
    if(!src){
      markNoAudio(el);
    }else{
      el.setAttribute('data-src',src);
      el.onclick=function(){TEPlayer.playTurn(el);};
      var pb=el.querySelector('.play-btn');
      if(pb) pb.addEventListener('click',function(e){e.stopPropagation();TEPlayer.playTurn(el);});
      /* probe skipped: keep button if path exists */
    }
    box.appendChild(el);
  });
  if(TEPlayer.syncPlayAllBtn) TEPlayer.syncPlayAllBtn();
  var tips=lesson.tips||[];
  var tipsBox=document.getElementById('tipsBox');
  var ul=document.getElementById('tips');
  ul.innerHTML='';
  if(tips.length){
    tipsBox.style.display='block';
    tips.forEach(function(t){
      var li=document.createElement('li');
      li.innerHTML='<strong>'+esc(t.en)+'</strong> — '+esc(t.ko);
      ul.appendChild(li);
    });
  }
}
function syncStickyOffset(){
  var tb=document.querySelector('.topbar');
  if(!tb) return;
  document.documentElement.style.setProperty('--topbar-h', tb.getBoundingClientRect().height+'px');
}
syncStickyOffset();
window.addEventListener('resize',syncStickyOffset);
if(window.ResizeObserver){
  var _tb=document.querySelector('.topbar');
  if(_tb) new ResizeObserver(syncStickyOffset).observe(_tb);
}
var params=new URLSearchParams(location.search);
var id=params.get('id')||'01';
TEData.loadLesson(id).then(render).catch(function(){
  document.getElementById('title').textContent='레슨을 찾을 수 없습니다';
});
</script>
</body></html>
