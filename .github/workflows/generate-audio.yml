name: Generate missing audio

on:
  workflow_dispatch:
  push:
    paths:
      - "data/lessons/**"
      - "scripts/generate-missing-audio.py"
      - ".github/workflows/generate-audio.yml"

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python scripts/generate-missing-audio.py
      - name: Commit audio if any
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add audio
          if git diff --staged --quiet; then
            echo "no new audio"
          else
            git commit -m "Add generated lesson audio"
            git push
          fi
