name: Generate missing audio

on:
  workflow_dispatch:
  push:
    paths:
      - "drop/**"
      - "data/lessons/**"
      - "scripts/generate-missing-audio.py"
      - "scripts/intake-drop.py"
      - ".github/workflows/generate-audio.yml"

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      # A lesson uploaded to drop/ is filed under the next free id, so the
      # uploader does not have to know which number that is.
      - run: python scripts/intake-drop.py
      # Adding a lesson should mean adding one file; derive the id list rather
      # than expecting whoever added it to also edit data/index.json.
      - run: python scripts/build-index.py
      - run: python scripts/generate-missing-audio.py
      - name: Commit index and audio if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data audio drop
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "File uploaded lessons, refresh index and audio"
            git pull --rebase origin main || git pull --rebase --autostash origin main
            git push
          fi
