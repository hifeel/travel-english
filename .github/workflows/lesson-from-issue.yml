name: Add lesson from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: add-lesson
  cancel-in-progress: false

jobs:
  add:
    if: contains(github.event.issue.labels.*.name, 'new-lesson')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts

      - id: lesson
        name: Build lesson from the issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/lesson-from-issue.py

      - name: Generate audio and index
        run: |
          python scripts/generate-missing-audio.py
          python scripts/build-index.py

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data audio
          git commit -m "Add lesson ${{ steps.lesson.outputs.lesson_id }}: ${{ steps.lesson.outputs.title }} (#${{ github.event.issue.number }})"
          git pull --rebase origin main || git pull --rebase --autostash origin main
          git push

      - name: Report on the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body \
            "레슨 #${{ steps.lesson.outputs.lesson_id }} 추가했습니다. 음성 생성과 배포가 끝나면 아래에서 볼 수 있습니다.
          https://hifeel.github.io/travel-english/lesson.html?id=${{ steps.lesson.outputs.lesson_id }}"
          gh issue close ${{ github.event.issue.number }}

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body \
            "레슨을 만들지 못했습니다. 실행 로그를 확인해 주세요:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          대화문은 한 줄에 한 턴, \`역할 | 화자 | English | 한국어\` 형식이어야 합니다."
