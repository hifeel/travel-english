name: 새 레슨 추가
description: 대화문을 넣으면 음성까지 만들어 사이트에 올립니다.
title: "새 레슨: "
labels: ["new-lesson"]
body:
  - type: markdown
    attributes:
      value: |
        제출하면 다음 번호로 레슨이 만들어지고, 음성이 생성되고, 사이트에 배포됩니다.
        번호·파일명·음성 경로는 신경 쓰지 않으셔도 됩니다. 1~2분 뒤 이 이슈에 결과가 달립니다.
  - type: input
    id: title_en
    attributes:
      label: 영어 제목
      placeholder: At the Pharmacy
    validations:
      required: true
  - type: input
    id: title_ko
    attributes:
      label: 한국어 제목
      placeholder: 약국에서
    validations:
      required: true
  - type: input
    id: subtitle
    attributes:
      label: 부제
      placeholder: 저녁에 약국에서 감기약 사기
    validations:
      required: true
  - type: input
    id: desc
    attributes:
      label: 목록에 뜰 한 줄 설명
      placeholder: 여행 중 목이 아파 약국을 찾아 증상과 복용법을 확인하는 회화
    validations:
      required: true
  - type: textarea
    id: turns
    attributes:
      label: 대화문
      description: |
        한 줄에 한 턴, 항목은 | 로 구분합니다.
        역할 | 화자 | English | 한국어
        역할은 you(여성 음성) 또는 them(남성 음성)입니다.
      render: text
      placeholder: |
        you | You (Traveler) | Excuse me. I have a sore throat. | 실례합니다. 목이 아파요.
        them | Pharmacist | How long have you had the symptoms? | 증상이 생긴 지 얼마나 됐나요?
    validations:
      required: true
  - type: textarea
    id: tips
    attributes:
      label: 표현 정리 (선택)
      description: 한 줄에 하나, English | 한국어
      render: text
      placeholder: |
        I have a sore throat. | 목이 아파요.
        Can I take them with food? | 식사와 함께 먹어도 될까요?
