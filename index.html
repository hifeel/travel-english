<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Travel English">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v2.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512-v2.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192-v2.png">
  <script>(function(){if(!('serviceWorker' in navigator))return;window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn(e);});});})();</script>

  <title>Travel English - 여행 영어 회화</title>
  <style>
    :root { --primary:#2563eb; --bg:#f8fafc; --card:#fff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); }
    .container { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
    header { text-align:center; margin-bottom:28px; }
    header h1 { font-size:28px; font-weight:800; color:var(--primary); margin-bottom:8px; }
    header p { color:var(--muted); font-size:15px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:14px; }
    .card a { text-decoration:none; color:inherit; display:block; }
    .card:hover { box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .title-row { display:flex; align-items:center; gap:8px; }
    .card h2 { font-size:18px; font-weight:700; margin:0; }
    .card p { color:var(--muted); font-size:14px; margin-top:6px; }
    .badge { display:inline-block; background:#dbeafe; color:var(--primary); font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; margin-right:8px; flex-shrink:0; }
    .card.done { background:#f8fafc; border-color:#e2e8f0; opacity:.82; }
    .card.done h2 { color:#64748b; font-weight:600; }
    .card.done p { color:#94a3b8; }
    .card.done .badge { background:#e2e8f0; color:#64748b; }
    .done-mark { margin-left:auto; font-size:11px; font-weight:600; color:#64748b; background:#e2e8f0; padding:2px 8px; border-radius:999px; flex-shrink:0; }

    footer { text-align:center; margin-top:40px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✈️ Travel English</h1>
      <p>여행에서 바로 쓰는 영어 회화</p>
    </header>
    <script src="app.js?v=15"></script>
    <div id="list"></div>
    <footer>hifeel.github.io/travel-english</footer>
  </div>

  <script>
    function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
    TEData.loadLessons().then(function(data){
      const box=document.getElementById('list');
      const done=(window.TEDone&&TEDone.load())||[];
      (data.lessons||[]).slice().reverse().forEach(function(l){
        const a=document.createElement('a');
        a.href='lesson.html?id='+encodeURIComponent(l.id);
        const isDone=done.indexOf(String(l.id))>=0;
        a.innerHTML='<div class="title-row"><span class="badge">#'+esc(l.id)+'</span><h2>'+esc(l.title_en)+'</h2>'+(isDone?'<span class="done-mark">완료</span>':'')+'</div><p>'+esc(l.desc||l.title_ko||'')+'</p>';
        const card=document.createElement('div');
        card.className='card'+(isDone?' done':'');
        card.appendChild(a);
        box.appendChild(card);
      });
    }).catch(function(){
      document.getElementById('list').textContent='목록을 불러오지 못했습니다';
    });
  </script>
</body>
</html>
