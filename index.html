<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Travel English">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v2.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512-v2.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192-v2.png">
  <script>(function(){if(!('serviceWorker' in navigator))return;window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn(e);});});})();</script>

  <title>Travel English - 여행 영어 회화</title>
  <style>
    :root { --primary:#2563eb; --primary-hover:#1d4ed8; --bg:#f8fafc; --card:#fff; --text:#1e293b; --muted:#64748b; --border:#e2e8f0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); }
    .container { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
    header { text-align:center; margin-bottom:20px; }
    header h1 { font-size:28px; font-weight:800; color:var(--primary); margin-bottom:6px; }
    header p { color:var(--muted); font-size:15px; }

    .done-stat-link {
      background:none; border:none; padding:0;
      color:var(--primary); font-size:13px; font-weight:700;
      text-decoration:underline; text-underline-offset:2px; cursor:pointer;
    }
    .done-stat-link:hover { color:#1d4ed8; }

    /* 카테고리 선택 영역 */
    .category-section { margin-bottom:24px; }
    .category-title { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px; }
    .category-nav { display:flex; flex-wrap:wrap; gap:8px; }
    .cat-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:#fff; border:1px solid var(--border); border-radius:999px;
      padding:8px 14px; font-size:14px; font-weight:600; color:var(--text);
      cursor:pointer; transition:all .15s ease; user-select:none;
    }
    .cat-btn:hover { background:#f1f5f9; border-color:#cbd5e1; }
    .cat-btn.active {
      background:var(--primary); color:#fff; border-color:var(--primary);
      box-shadow:0 3px 10px rgba(37,99,235,.25);
    }
    .cat-icon { font-size:15px; line-height:1; }
    .cat-count {
      display:inline-block; font-size:11px; font-weight:700;
      padding:2px 7px; border-radius:999px;
      background:#f1f5f9; color:var(--muted);
    }
    .cat-btn.active .cat-count { background:rgba(255,255,255,.25); color:#fff; }

    /* 목록 헤더 & 상태 */
    .list-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; padding:0 2px; flex-wrap:wrap; }
    .list-title-group { display:flex; align-items:baseline; gap:8px; }
    .list-header h2 { font-size:16px; font-weight:700; color:var(--text); margin:0; }
    .list-header span { font-size:13px; color:var(--muted); }
    .filter-done-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:#fff; border:1px solid var(--border); border-radius:8px;
      padding:6px 11px; font-size:12px; font-weight:600; cursor:pointer;
      color:var(--muted); user-select:none; transition:all .15s ease;
    }
    .filter-done-btn:hover { background:#f1f5f9; border-color:#cbd5e1; color:var(--text); }
    .filter-done-btn .box {
      width:15px; height:15px; border:2px solid #cbd5e1; border-radius:3px;
      display:inline-flex; align-items:center; justify-content:center;
      line-height:1; font-size:10px; color:#fff; transition:all .15s ease;
    }
    .filter-done-btn.on { background:#ecfdf5; border-color:#86efac; color:#15803d; }
    .filter-done-btn.on .box { background:#22c55e; border-color:#16a34a; }
    .filter-done-btn.on .box:after { content:"\2713"; font-weight:700; }
    .filter-done-btn.is-hidden { display:none; }

    /* 레슨 카드 */
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:12px; transition:transform .12s ease, box-shadow .12s ease; }
    .card a { text-decoration:none; color:inherit; display:block; }
    .card:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.06); border-color:#cbd5e1; }
    .card-cover { width:100%; height:120px; object-fit:cover; border-radius:8px; margin-bottom:12px; background:#eff6ff; display:block; }
    .title-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .card h3 { font-size:17px; font-weight:700; margin:0; }
    .card p { color:var(--muted); font-size:14px; margin-top:6px; line-height:1.45; }
    .badge { display:inline-block; background:#dbeafe; color:var(--primary); font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; flex-shrink:0; }
    .cat-tag { display:inline-block; font-size:11px; font-weight:600; color:#475569; background:#f1f5f9; padding:2px 8px; border-radius:6px; flex-shrink:0; }
    .card.done { background:#f8fafc; border-color:#e2e8f0; opacity:.85; }
    .card.done h3 { color:#64748b; font-weight:600; }
    .card.done p { color:#94a3b8; }
    .card.done .badge { background:#e2e8f0; color:#64748b; }
    .card.done .cat-tag { background:#e2e8f0; color:#94a3b8; }
    .done-mark { margin-left:auto; font-size:11px; font-weight:600; color:#15803d; background:#dcfce7; padding:2px 8px; border-radius:999px; flex-shrink:0; }
    .empty-msg { text-align:center; padding:48px 16px; color:var(--muted); font-size:14px; background:#fff; border-radius:12px; border:1px dashed var(--border); line-height:1.6; }

    /* 북마크 전용 카드 */
    .bm-card {
      background:var(--card); border:1px solid var(--border); border-radius:12px;
      padding:16px 18px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.03);
      cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, border-color .15s ease;
    }
    .bm-card:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.06); border-color:#cbd5e1; }
    .bm-card.playing { border-color:var(--primary); box-shadow:0 0 0 2px rgba(37,99,235,.15); }
    .bm-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .bm-badge-group { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .bm-lesson-badge { text-decoration:none; color:var(--primary); font-size:12px; font-weight:700; background:#eff6ff; padding:3px 8px; border-radius:6px; transition:background .15s ease; }
    .bm-lesson-badge:hover { background:#dbeafe; }
    .bm-speaker { font-size:11px; font-weight:700; color:#64748b; background:#f1f5f9; padding:3px 8px; border-radius:6px; text-transform:uppercase; letter-spacing:.5px; }
    .bm-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .bm-star-btn {
      width:28px; height:28px; border-radius:50%; border:1px solid #facc15;
      background:#fef9c3; color:#ca8a04; font-size:14px; line-height:1;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      transition:all .15s ease;
    }
    .bm-star-btn:hover { background:#fef08a; }
    .bm-play-btn {
      width:28px; height:28px; border-radius:50%; border:none;
      background:var(--primary); color:#fff; font-size:11px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; flex-shrink:0;
    }
    .bm-play-btn.playing { background:#dc2626; }
    .bm-en { font-size:17px; font-weight:600; color:var(--text); margin-bottom:6px; line-height:1.45; word-break:keep-all; overflow-wrap:break-word; }
    .bm-ko-line { display:flex; align-items:flex-end; justify-content:space-between; gap:8px; font-size:14px; color:var(--muted); line-height:1.4; }
    .search-btn { position:static; flex-shrink:0; width:26px; height:26px; border-radius:50%; border:1px solid #e2e8f0; background:#fff; text-decoration:none; display:flex; align-items:center; justify-content:center; }
    .search-btn svg { width:15px; height:15px; display:block; }

    footer { text-align:center; margin-top:40px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✈️ Travel English</h1>
      <p>여행에서 바로 쓰는 영어 회화</p>
    </header>

    <!-- 카테고리 선택 영역 -->
    <section class="category-section">
      <div class="category-title">카테고리 선택</div>
      <div class="category-nav" id="catNav"></div>
    </section>

    <!-- 레슨 목록 영역 -->
    <div class="list-header">
      <div class="list-title-group">
        <h2 id="listTitle">전체 레슨</h2>
        <span id="listCount"></span>
      </div>
      <button type="button" class="filter-done-btn" id="filterDoneBtn">
        <span class="box"></span> 완료 숨기기
      </button>
    </div>
    <div id="list"></div>

    <script src="app.js?v=19"></script>
    <footer>hifeel.github.io/travel-english</footer>
  </div>

  <script>
    (function () {
      var GICON = '<svg viewBox="0 0 24 24" width="15" height="15"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>';

      function esc(s) {
        var d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
      }

      var CATEGORY_DEF = [
        { id: 'all', name: '전체', icon: '🌍' },
        { id: 'bookmark', name: '북마크', icon: '⭐' },
        { id: 'done', name: '완료됨', icon: '✅' },
        { id: 'hotel', name: '호텔 & 숙소', icon: '🏨' },
        { id: 'airport', name: '공항 & 비행', icon: '✈️' },
        { id: 'dining', name: '식당 & 카페', icon: '🍽️' },
        { id: 'transport', name: '교통 & 이동', icon: '🚖' },
        { id: 'shopping', name: '쇼핑 & 편의', icon: '🛍️' },
        { id: 'activity', name: '관광 & 레저', icon: '🎟️' },
        { id: 'emergency', name: '약국 & 긴급', icon: '💊' }
      ];

      var currentCat = 'all';
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get('cat')) currentCat = params.get('cat');
      } catch (e) {}

      var allLessons = [];
      var doneList = [];
      var counts = {};

      var HIDE_DONE_KEY = 'te-hide-done';
      var hideDone = false;
      try {
        hideDone = localStorage.getItem(HIDE_DONE_KEY) === '1';
      } catch (e) {}

      function syncDoneFilterBtn() {
        var btn = document.getElementById('filterDoneBtn');
        if (!btn) return;
        btn.classList.toggle('on', hideDone);
        btn.classList.toggle('is-hidden', currentCat === 'bookmark' || currentCat === 'done');
      }

      var filterDoneBtn = document.getElementById('filterDoneBtn');
      if (filterDoneBtn) {
        filterDoneBtn.onclick = function () {
          hideDone = !hideDone;
          try {
            localStorage.setItem(HIDE_DONE_KEY, hideDone ? '1' : '0');
          } catch (e) {}
          syncDoneFilterBtn();
          renderLessonList();
        };
      }

      var currentBmAudio = null;
      var currentBmCard = null;
      var currentBmBtn = null;

      function stopBmAudio() {
        if (currentBmAudio) {
          try { currentBmAudio.pause(); } catch(e) {}
          currentBmAudio = null;
        }
        try { window.speechSynthesis.cancel(); } catch(e) {}
        if (currentBmCard) {
          currentBmCard.classList.remove('playing');
          currentBmCard = null;
        }
        if (currentBmBtn) {
          currentBmBtn.textContent = '▶';
          currentBmBtn.classList.remove('playing');
          currentBmBtn = null;
        }
      }

      function toggleBmAudio(src, text, btn, card) {
        if (currentBmCard === card) {
          stopBmAudio();
          return;
        }
        stopBmAudio();

        if (btn) {
          btn.textContent = '■';
          btn.classList.add('playing');
        }
        if (card) {
          card.classList.add('playing');
        }
        currentBmBtn = btn;
        currentBmCard = card;

        if (src) {
          var audio = new Audio(src);
          currentBmAudio = audio;
          audio.onended = audio.onerror = function () {
            stopBmAudio();
          };
          audio.play().catch(function () {
            speakBmFallback(text);
          });
        } else {
          speakBmFallback(text);
        }
      }

      function speakBmFallback(text) {
        if ('speechSynthesis' in window && text) {
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.onend = u.onerror = function () {
            stopBmAudio();
          };
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
        } else {
          stopBmAudio();
        }
      }

      function renderCategories() {
        var nav = document.getElementById('catNav');
        nav.innerHTML = '';
        CATEGORY_DEF.forEach(function (cat) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cat-btn' + (currentCat === cat.id ? ' active' : '');
          var count = counts[cat.id] || 0;
          btn.innerHTML = '<span class="cat-icon">' + cat.icon + '</span> ' +
                          '<span class="cat-name">' + esc(cat.name) + '</span> ' +
                          '<span class="cat-count">' + count + '</span>';
          btn.onclick = function () {
            if (currentCat === cat.id) return;
            selectCategory(cat.id);
          };
          nav.appendChild(btn);
        });
      }

      function selectCategory(catId, push) {
        if (typeof push === 'undefined') push = true;
        currentCat = catId;
        if (push) {
          try {
            var url = new URL(window.location);
            if (catId === 'all') {
              url.searchParams.delete('cat');
            } else {
              url.searchParams.set('cat', catId);
            }
            window.history.pushState({ cat: catId }, '', url);
          } catch (e) {}
        }

        var buttons = document.querySelectorAll('.cat-btn');
        CATEGORY_DEF.forEach(function (c, idx) {
          if (buttons[idx]) {
            buttons[idx].classList.toggle('active', c.id === currentCat);
          }
        });

        renderLessonList();
      }

      window.addEventListener('popstate', function () {
        var cat = 'all';
        try {
          var params = new URLSearchParams(window.location.search);
          cat = params.get('cat') || 'all';
        } catch (e) {}
        if (!CATEGORY_DEF.some(function (c) { return c.id === cat; })) {
          cat = 'all';
        }
        selectCategory(cat, false);
      });

      function renderLessonList() {
        var box = document.getElementById('list');
        var titleEl = document.getElementById('listTitle');
        var countEl = document.getElementById('listCount');
        box.innerHTML = '';

        stopBmAudio();
        syncDoneFilterBtn();

        // 북마크 뷰
        if (currentCat === 'bookmark') {
          var bookmarks = (window.TEBookmark && TEBookmark.load()) || [];
          titleEl.textContent = '⭐ 북마크한 문장';
          countEl.textContent = bookmarks.length + '개의 문장';

          if (bookmarks.length === 0) {
            box.innerHTML = '<div class="empty-msg">⭐ 아직 북마크한 문장이 없습니다.<br><br>대화문 화면에서 각 문장의 <strong>별표(☆)</strong>를 누르면 이곳에 모아서 복습할 수 있습니다.</div>';
            return;
          }

          bookmarks.forEach(function (item) {
            var card = document.createElement('div');
            card.className = 'bm-card';
            var q = encodeURIComponent((item.en || '') + ' 이 영어 문장을 번역하고 설명해줘');
            var lessonTitle = item.lessonTitleKo || item.lessonTitleEn || ('레슨 #' + item.lessonId);
            var playBtnHtml = item.audio ? '<button class="bm-play-btn" type="button" title="재생">▶</button>' : '';

            card.innerHTML =
              '<div class="bm-top">' +
                '<div class="bm-badge-group">' +
                  '<a class="bm-lesson-badge" href="lesson.html?id=' + encodeURIComponent(item.lessonId) + '&from=bookmark">#' + esc(item.lessonId) + ' ' + esc(lessonTitle) + ' →</a>' +
                  '<span class="bm-speaker">' + esc(item.speaker || 'SPEAKER') + '</span>' +
                '</div>' +
                '<div class="bm-actions">' +
                  '<button class="bm-star-btn" type="button" title="북마크 해제">★</button>' +
                  playBtnHtml +
                '</div>' +
              '</div>' +
              '<div class="bm-en">' + esc(item.en) + '</div>' +
              '<div class="bm-ko-line">' +
                '<div>' + esc(item.ko) + '</div>' +
                '<a class="search-btn" href="https://www.google.com/search?q=' + q + '" target="_blank" rel="noopener noreferrer">' + GICON + '</a>' +
              '</div>';

            var pb = card.querySelector('.bm-play-btn');

            var toggleCardAudio = function () {
              toggleBmAudio(item.audio, item.en, pb, card);
            };

            // 카드 박스 터치/클릭 시 재생 및 정지 토글
            card.onclick = toggleCardAudio;

            // 재생 버튼 클릭 시 토글 (이벤트 전파 방지)
            if (pb) {
              pb.onclick = function (e) {
                e.stopPropagation();
                toggleCardAudio();
              };
            }

            // 북마크 해제 버튼: 독립 작동 (카드 클릭 전파 방지)
            var starBtn = card.querySelector('.bm-star-btn');
            starBtn.onclick = function (e) {
              e.stopPropagation();
              if (currentBmCard === card) stopBmAudio();
              if (window.TEBookmark) TEBookmark.remove(item.key);
              card.remove();
              counts.bookmark = Math.max(0, (counts.bookmark || 1) - 1);
              renderCategories();
              var rest = box.querySelectorAll('.bm-card').length;
              countEl.textContent = rest + '개의 문장';
              if (rest === 0) {
                box.innerHTML = '<div class="empty-msg">⭐ 아직 북마크한 문장이 없습니다.<br><br>대화문 화면에서 각 문장의 <strong>별표(☆)</strong>를 누르면 이곳에 모아서 복습할 수 있습니다.</div>';
              }
            };

            // 원글 링크: 독립 작동 (상세 레슨 이동, 카드 클릭 전파 방지)
            var lessonLink = card.querySelector('.bm-lesson-badge');
            if (lessonLink) {
              lessonLink.onclick = function (e) {
                e.stopPropagation();
              };
            }

            // 구글 번역/설명 링크: 독립 작동 (새 창 열기, 카드 클릭 전파 방지)
            var searchBtn = card.querySelector('.search-btn');
            if (searchBtn) {
              searchBtn.onclick = function (e) {
                e.stopPropagation();
              };
            }

            box.appendChild(card);
          });
          return;
        }

        // 완료 레슨 모아보기 뷰
        if (currentCat === 'done') {
          var doneLessons = allLessons.filter(function (l) {
            return doneList.indexOf(String(l.id)) >= 0;
          }).reverse();

          titleEl.textContent = '✅ 완료한 레슨';
          var pct = allLessons.length > 0 ? Math.round((doneLessons.length / allLessons.length) * 100) : 0;
          countEl.textContent = doneLessons.length + '개의 레슨 (' + pct + '% 달성)';

          if (doneLessons.length === 0) {
            box.innerHTML = '<div class="empty-msg">아직 완료한 레슨이 없습니다.<br><br>각 레슨 페이지에서 <strong>[완료]</strong> 버튼을 누르면 여기에 기록되어 달성도를 확인할 수 있습니다!</div>';
            return;
          }

          doneLessons.forEach(function (l) {
            var a = document.createElement('a');
            a.href = 'lesson.html?id=' + encodeURIComponent(l.id) + '&from=done';
            var img = l.image ? '<img class="card-cover" src="' + esc(l.image) + '" alt="">' : '';
            var catLabel = l.category_ko || (CATEGORY_DEF.find(function(c){return c.id===l.category;}) || {}).name || '';

            a.innerHTML = img +
              '<div class="title-row">' +
                '<span class="badge">#' + esc(l.id) + '</span>' +
                '<h3>' + esc(l.title_en) + '</h3>' +
                (catLabel ? '<span class="cat-tag">' + esc(catLabel) + '</span>' : '') +
                '<span class="done-mark">✓ 완료</span>' +
              '</div>' +
              '<p>' + esc(l.desc || l.title_ko || '') + '</p>';

            var card = document.createElement('div');
            card.className = 'card done';
            card.appendChild(a);
            box.appendChild(card);
          });
          return;
        }

        // 일반 레슨 뷰 (역순)
        var matchedCat = CATEGORY_DEF.find(function (c) { return c.id === currentCat; });
        var catName = matchedCat ? (matchedCat.icon + ' ' + matchedCat.name) : '전체';

        var filtered = allLessons.filter(function (l) {
          if (hideDone && doneList.indexOf(String(l.id)) >= 0) return false;
          if (currentCat === 'all') return true;
          return l.category === currentCat;
        }).reverse();

        titleEl.textContent = catName;

        var totalCount = allLessons.length;
        var doneCount = doneList.length;
        var pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

        if (currentCat === 'all') {
          countEl.innerHTML = '총 ' + totalCount + '개의 레슨 (<button type="button" class="done-stat-link" id="doneStatLink" title="완료한 레슨 모아보기">' + doneCount + '개 완료</button>, ' + pct + '%)';
        } else {
          var catTotal = allLessons.filter(function (l) { return l.category === currentCat; }).length;
          var catDone = allLessons.filter(function (l) { return l.category === currentCat && doneList.indexOf(String(l.id)) >= 0; }).length;
          var catPct = catTotal > 0 ? Math.round((catDone / catTotal) * 100) : 0;
          countEl.innerHTML = catTotal + '개의 레슨 (<button type="button" class="done-stat-link" id="doneStatLink" title="완료한 레슨 모아보기">' + catDone + '개 완료</button>, ' + catPct + '%)';
        }

        var doneLink = document.getElementById('doneStatLink');
        if (doneLink) {
          doneLink.onclick = function () {
            selectCategory('done');
          };
        }

        if (filtered.length === 0) {
          var hasHiddenDone = hideDone && allLessons.some(function(l){
            return (currentCat === 'all' || l.category === currentCat) && doneList.indexOf(String(l.id)) >= 0;
          });
          if (hasHiddenDone) {
            box.innerHTML = '<div class="empty-msg">🎉 이 카테고리의 모든 레슨을 완료했습니다!<br><br>\'완료 숨기기\'를 해제하면 완료된 레슨을 다시 볼 수 있습니다.</div>';
          } else {
            box.innerHTML = '<div class="empty-msg">해당 카테고리의 레슨이 없습니다.</div>';
          }
          return;
        }

        filtered.forEach(function (l) {
          var a = document.createElement('a');
          a.href = 'lesson.html?id=' + encodeURIComponent(l.id) + (currentCat !== 'all' ? '&cat=' + encodeURIComponent(currentCat) : '');
          var isDone = doneList.indexOf(String(l.id)) >= 0;
          var img = l.image ? '<img class="card-cover" src="' + esc(l.image) + '" alt="">' : '';
          var catLabel = l.category_ko || (CATEGORY_DEF.find(function(c){return c.id===l.category;}) || {}).name || '';

          a.innerHTML = img +
            '<div class="title-row">' +
              '<span class="badge">#' + esc(l.id) + '</span>' +
              '<h3>' + esc(l.title_en) + '</h3>' +
              (catLabel ? '<span class="cat-tag">' + esc(catLabel) + '</span>' : '') +
              (isDone ? '<span class="done-mark">✓ 완료</span>' : '') +
            '</div>' +
            '<p>' + esc(l.desc || l.title_ko || '') + '</p>';

          var card = document.createElement('div');
          card.className = 'card' + (isDone ? ' done' : '');
          card.appendChild(a);
          box.appendChild(card);
        });
      }

      TEData.loadLessons().then(function (data) {
        allLessons = (data.lessons || []).slice();
        doneList = (window.TEDone && TEDone.load()) || [];

        counts = { all: allLessons.length };
        allLessons.forEach(function (l) {
          var c = l.category || 'other';
          counts[c] = (counts[c] || 0) + 1;
        });
        counts.bookmark = (window.TEBookmark && TEBookmark.load().length) || 0;
        counts.done = doneList.length;

        if (currentCat !== 'all' && !CATEGORY_DEF.some(function (c) { return c.id === currentCat; })) {
          currentCat = 'all';
        }

        renderCategories();
        renderLessonList();
      }).catch(function (err) {
        console.error(err);
        document.getElementById('list').textContent = '목록을 불러오지 못했습니다.';
      });
    })();
  </script>
</body>
</html>
